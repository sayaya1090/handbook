<!DOCTYPE html>
<html>
<head>
    <title>Agent UI Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="js/rxjs.umd.min.js"></script>
    <script type="text/javascript" src="js/fontawesome.min.js"></script>
    <script type="text/javascript" src="js/sharp-light.min.js"></script>
    <script type="text/javascript" src="js/sharp-solid.min.js"></script>
    <script type="text/javascript" src="js/sayaya-ui.js"></script>
    <script type="text/javascript" src="js/theme.js"></script>
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ui-components.css">
    <link rel="stylesheet" href="css/agent-ui.css">
    <script type="text/javascript" src="agenttest/agenttest.nocache.js"></script>
    <style>
        html, body { height: auto; overflow: auto; }
        /* 테스트 버튼 바 */
        .test-toolbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
            display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 12px;
            background: rgba(255,255,255,0.95); border-bottom: 1px solid #e0e0e0;
        }
        [color-theme="dark"] .test-toolbar {
            background: rgba(30,30,30,0.95) !important;
            border-bottom-color: #444 !important;
        }
        /* 테스트 타겟 요소 */
        #test-area { padding: 80px 20px 600px; }
        #target-element {
            width: 300px; height: 60px; background: #e3f2fd; border: 1px solid #90caf9;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 20px 0;
        }
        #scroll-target {
            margin-top: 400px; width: 300px; height: 60px; background: #fff3e0;
            border: 1px solid #ffcc80; border-radius: 8px; display: flex;
            align-items: center; justify-content: center;
        }
        [color-theme="dark"] #target-element {
            background: #1a237e !important; border-color: #3949ab !important; color: #bbdefb !important;
        }
        [color-theme="dark"] #scroll-target {
            background: #3e2723 !important; border-color: #6d4c41 !important; color: #ffe0b2 !important;
        }
    </style>
</head>
<body></body>
</html>
