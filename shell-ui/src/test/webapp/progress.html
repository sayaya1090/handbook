    <script type="text/javascript" src="js/rxjs.umd.min.js"></script>
    <script type="text/javascript" src="js/fontawesome.min.js"></script>
    <script type="text/javascript" src="js/sharp-light.min.js"></script>

    <script type="text/javascript" src="progress/progress.nocache.js"></script>
    <style>
        .progress-container {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 9999;
            display: flex; flex-direction: column; align-items: stretch;
            transition: opacity 0.3s;
        }
        .progress-label {
            text-align: center; font-size: 13px; padding: 4px 0;
            color: var(--md-sys-color-on-surface, #1a1a1a);
            background: var(--md-sys-color-surface-container, #f3f3f3);
        }
    </style>
