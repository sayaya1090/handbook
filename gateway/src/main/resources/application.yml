spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway.server.webflux:
      routes:
        # Clean URL 지원: 브라우저에서 직접 접속 시 app.html 반환
        - id: ui-clean-urls
          uri: ${gateway.routes.static:http://localhost:8080}
          predicates:
            - Path=/types,/documents,/workspaces/**,/dashboard
            - Method=GET
            - Header=Accept, ^(?!.*application/(json|vnd\.sayaya)).*text/html.*
          filters:
            - SetPath=/app.html
          order: 0

        # 인증
        - id: login
          uri: ${gateway.routes.login:http://localhost:8081}
          predicates:
            - Path=/auth/**,/oauth2/**,/login/**,/user
          order: 1
        # 실시간 이벤트 (SSE)
        - id: event-broadcaster
          uri: ${gateway.routes.event-broadcaster:http://localhost:8088}
          predicates:
            - Path=/workspaces/*/messages
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: eventBroadcasterCB
                fallbackUri: forward:/fallback/empty
          order: 2
        # 타입 조회
        - id: type-query
          uri: ${gateway.routes.type-query:http://localhost:8082}
          predicates:
            - Path=/workspaces/*/types/**,/workspaces/*/layouts/**
            - Method=GET
          order: 3
        # 타입 저장
        - id: type-command
          uri: ${gateway.routes.type-command:http://localhost:8083}
          predicates:
            - Path=/workspaces/*/types/**,/workspaces/*/layouts/**,/workspaces/*/schema
            - Method=PUT,PATCH,DELETE
          order: 4
        # 문서 조회 + 대시보드 통계
        - id: document-query
          uri: ${gateway.routes.document-query:http://localhost:8084}
          predicates:
            - Path=/workspaces/*/documents/**,/workspaces/*/*/*,/workspaces/*/stats,/workspaces/*/stats/**,/workspaces/*/quality-issues,/workspaces/*/agent-activity
            - Method=GET
          order: 5
        # 문서 저장 및 파일 업로드
        - id: document-command
          uri: ${gateway.routes.document-command:http://localhost:8085}
          predicates:
            - Path=/workspaces/*/documents/**,/workspaces/*/files/**
            - Method=PUT,PATCH,DELETE,POST
          order: 6
        # 워크스페이스 조회 (CQRS Read)
        - id: workspace-query
          uri: ${gateway.routes.workspace-query:http://localhost:8089}
          predicates:
            - Path=/workspaces,/workspaces/**
            - Method=GET
          order: 7
        # 워크스페이스 저장 (CQRS Write)
        - id: workspace-command
          uri: ${gateway.routes.workspace-command:http://localhost:8086}
          predicates:
            - Path=/workspaces,/workspaces/**
            - Method=POST,PUT,DELETE
          order: 8
        # 에이전트
        - id: assistant
          uri: ${gateway.routes.assistant:http://localhost:8087}
          predicates:
            - Path=/assistant/**
          filters:
            - name: CircuitBreaker
              args:
                name: assistantCB
                fallbackUri: forward:/fallback/empty
          order: 9
        # 정적 리소스 - 도메인 하위 경로 매핑 (JS, CSS, JSON 등)
        - id: static-assets-domains
          uri: ${gateway.routes.static:http://localhost:8080}
          predicates:
            - Path=/{domain:(?:workspaces|types|documents|dashboard)}/{dir:(?:js|css|json|wav|svg|ico)}/**
          filters:
            - RewritePath=/(?:workspaces|types|documents|dashboard)/(?<dir>js|css|json|wav|svg|ico)/(?<file>.*), /static/${dir}/${file}
          order: -1
        # 정적 리소스 - 루트 경로 매핑
        - id: static-assets-root
          uri: ${gateway.routes.static:http://localhost:8080}
          predicates:
            - Path=/js/**, /css/**, /json/**, /wav/**, /svg/**, /ico/**, /manifest.json, /service-worker.js, /favicon.ico, /app.html
          filters:
            - RewritePath=/(?<file>.*), /static/${file}
          order: -1
        # SPA Fallback
        - id: ui-fallback
          uri: ${gateway.routes.static:http://localhost:8080}
          predicates:
            - Path=/**
            - Header=Accept, .*text/html.*
          filters:
            - SetPath=/app.html
          order: 1000
server:
  port: ${SERVER_PORT:8080}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
