spring:
  application:
    name: workspace-command
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:handbook}
    username: ${DB_USER:handbook}
    # Production: append ?sslMode=require to URL
    password: ${DB_PASSWORD}
    pool:
      max-size: 20
      initial-size: 5
      max-idle-time: 30m
      validation-query: SELECT 1
  cloud:
    stream:
      bindings:
        workspace-out-0:
          # docs/contracts/events.md — WORKSPACE_* 는 handbook-events 와 별개 토픽.
          destination: workspace-events
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          # StreamBridge → MessageConverter(application/json) 는 payload 를 byte[] 로 만들어
          # binder 에 넘기므로 producer value serializer 는 ByteArraySerializer 여야 한다.
          configuration:
            value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
