name: 에이전트 UI 모듈 빌드
on:
  push:
    paths:
      - agent-ui/src/main/**
      - agent-ui/build.gradle.kts
      - activity/src/main/**
      - agent-bridge/src/main/**
      - agent-protocol/src/main/**
      - ui-components/src/main/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/_frontend-deploy.yaml
    with:
      submodule: agent-ui
    secrets: inherit
