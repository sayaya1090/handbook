name: App 모듈 빌드
on:
  push:
    paths:
      - app/**
  workflow_dispatch:
permissions:
  contents: write  # Publish prerelease step 이 gh release create 로 tag/release 를 만든다
jobs:
  build:
    runs-on: handbook-operator
    env:
      SUBMODULE: app
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Force LFS pull
        run: |
          git lfs pull
          git lfs ls-files
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build & Test
        run: ./gradlew $SUBMODULE:build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7
      - name: Pack static assets
        run: |
          # app 모듈은 war 플러그인이 없어서 webapp 디렉토리와 GWT 컴파일 출력을
          # 직접 모아 tar 로 묶는다.
          #   app/src/main/webapp/**        — app.html, manifest.json, service-worker.js,
          #                                   js/{rxjs,fontawesome,sayaya-ui,theme,...}.js,
          #                                   css/{global,shell,ui-components,agent,fontawesome}.css,
          #                                   js/language.{ko,en}.json (mergeI18nProd 출력)
          #   app/build/gwt/war/**          — app/app.nocache.js 등 GWT 컴파일 출력
          mkdir -p dist/static
          cp -r app/src/main/webapp/. dist/static/
          cp -r app/build/gwt/war/. dist/static/
          tar -czf app.tar.gz -C dist/static .
          echo "tarball contents:" && tar -tzf app.tar.gz | head -30
      # Kargo Warehouse 가 git tag 패턴 `app-*` 로 watch → Stage promotion 이
      # release asset 을 다운로드해서 vars.bucket 에 sync.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-${GITHUB_SHA::7}"
          # 같은 commit 재실행 시 tag 충돌 방지 — 기존 release 와 tag 를 선제적으로 제거
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "app ${GITHUB_SHA::7}" \
            --notes "app build for commit ${GITHUB_SHA}" \
            app.tar.gz
