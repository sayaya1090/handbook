name: App 모듈 빌드
on:
  push:
    paths:
      - app/**
  workflow_dispatch:
permissions:
  contents: write  # Publish prerelease step 이 gh release create 로 tag/release 를 만든다
jobs:
  build:
    runs-on: handbook-operator
    env:
      SUBMODULE: app
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Force LFS pull
        run: |
          git lfs pull
          git lfs ls-files
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build & Test
        run: ./gradlew $SUBMODULE:build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7
      - name: Pack static assets
        run: |
          # war 플러그인이 src/main/webapp(app.html, manifest.json, service-worker.js,
          # 공용 js/*.js, css/*.css) + GWT 컴파일 출력(app/*.nocache.js 등) 을
          # 하나의 WAR 로 묶는다. META-INF/WEB-INF 는 정적 호스팅에 불필요하므로 제외.
          mkdir -p dist/static
          unzip -o $SUBMODULE/build/libs/*.war -x "META-INF/*" "WEB-INF/*" -d dist/static
          tar -czf app.tar.gz -C dist/static .
          echo "tarball contents:" && tar -tzf app.tar.gz | head -30
      # Kargo Warehouse 가 git tag 패턴 `app-*` 로 watch → Stage promotion 이
      # release asset 을 다운로드해서 vars.bucket 에 sync.
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="app-${GITHUB_SHA::7}"
          # 같은 commit 재실행 시 tag 충돌 방지 — 기존 release 와 tag 를 선제적으로 제거
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "app ${GITHUB_SHA::7}" \
            --notes "app build for commit ${GITHUB_SHA}" \
            app.tar.gz
