name: 쉘 UI 모듈 빌드
on:
  push:
    paths:
      - shell-ui/src/main/**
      - shell-ui/build.gradle.kts
      - activity/src/main/**
      - agent-bridge/src/main/**
      - ui-components/src/main/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/_frontend-deploy.yaml
    with:
      submodule: shell-ui
    secrets: inherit
