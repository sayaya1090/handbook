spring:
  application:
    name: login
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:handbook}
    username: ${DB_USER:handbook}
    password: ${DB_PASSWORD:handbook}
  security:
    authentication:
      header: ${AUTH_HEADER:Authorization}
      jwt-secret: ${JWT_SECRET:default-dev-secret-key-change-in-production}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: openid, profile, email
jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-change-in-production}
  duration: ${JWT_DURATION:3600}
  publisher: ${JWT_PUBLISHER:handbook}
  client: ${JWT_CLIENT:handbook}
auth:
  url:
    login-redirect-uri: ${LOGIN_REDIRECT_URI:/}
    logout-redirect-uri: ${LOGOUT_REDIRECT_URI:/}
