spring:
  application:
    name: login
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:handbook}
    username: ${DB_USER:handbook}
    # Production: append ?sslMode=require to URL
    password: ${DB_PASSWORD}
    pool:
      max-size: 20
      initial-size: 5
      max-idle-time: 30m
      validation-query: SELECT 1
  security:
    authentication:
      header: ${AUTH_HEADER:Authorization}
      jwt-secret: ${JWT_SECRET}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: openid, profile, email
jwt:
  secret: ${JWT_SECRET}
  duration: ${JWT_DURATION:3600}
  publisher: ${JWT_PUBLISHER:handbook}
  client: ${JWT_CLIENT:handbook}
auth:
  url:
    login-redirect-uri: ${LOGIN_REDIRECT_URI:/}
    logout-redirect-uri: ${LOGOUT_REDIRECT_URI:/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  pattern:
    console: "%d{ISO8601} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
