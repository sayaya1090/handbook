kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: '*'
    app.openshift.io/route-disabled: 'false'
    app.openshift.io/vcs-uri: 'https://github.com/sayaya1090/handbook/tree/main/gateway'
    configmap.reloader.stakater.com/reload: "gateway,observability"
  name: service-gateway
  namespace: {{ .Release.Namespace }}
  finalizers:
    - foregroundDeletion
  labels:
    app: gateway
    app.kubernetes.io/component: handbook
    app.kubernetes.io/instance: handbook
    app.kubernetes.io/name: handbook
    app.kubernetes.io/part-of: handbook
    app.openshift.io/runtime: spring-boot
    app.openshift.io/runtime-namespace: {{ .Release.Namespace }}
    app.openshift.io/runtime-version: latest
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        version: 0.0.1
        deployment: gateway
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '8080'
    spec:
      volumes:
        - name: config
          configMap:
            name: gateway
            defaultMode: 420
        - name: observability-config
          configMap:
            name: observability
            defaultMode: 420
      containers:
        - name: gateway
          image: {{ .Values.image.name }}:{{ .Values.image.tag | default "latest" }}
          ports:
              - containerPort: 8080
                protocol: TCP
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Seoul
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: handbook-jwt
                  key: jwt-secret
            # jar 내부 application.yml 에 이 파일을 덮어쓰기로 merge 한다
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/app/config/application.yaml"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://{{ .Values.host | default "handbook.sayaya.cloud" }}"
            # 백엔드 서비스 Service DNS (각 서비스가 차트화되면 갱신)
            - name: LOGIN_URI
              value: "http://service-login:8080"
            - name: EVENT_BROADCASTER_URI
              value: "http://event-broadcaster:8080"
            - name: SEARCH_TYPE_URI
              value: "http://service-search-type:8080"
            - name: PERSIST_TYPE_URI
              value: "http://service-persist-type:8080"
            - name: SEARCH_DOCUMENT_URI
              value: "http://service-search-document:8080"
            - name: PERSIST_DOCUMENT_URI
              value: "http://service-persist-document:8080"
            - name: PERSIST_WORKSPACE_URI
              value: "http://service-persist-workspace:8080"
            - name: ASSISTANT_URI
              value: "http://service-assistant:8080"
          resources:
            limits:
              cpu: '2'
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # jar 내부 application.yml 을 가리지 않는 별도 경로에 마운트 → SPRING_CONFIG_ADDITIONAL_LOCATION 으로 merge
            - name: config
              mountPath: /app/config/application.yaml
              subPath: application.yaml
            - name: observability-config
              mountPath: /app/resources/observability.yaml
              subPath: observability.yaml
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      imagePullSecrets: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 600
  paused: false
