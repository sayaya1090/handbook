kind: Deployment
apiVersion: apps/v1
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: '*'
    app.openshift.io/route-disabled: 'false'
    app.openshift.io/vcs-uri: 'https://github.com/sayaya1090/handbook/tree/main/gateway'
    configmap.reloader.stakater.com/reload: "gateway,observability,handbook-authentication"
  name: service-gateway
  namespace: {{ .Release.Namespace }}
  finalizers:
    - foregroundDeletion
  labels:
    app: gateway
    app.kubernetes.io/component: handbook
    app.kubernetes.io/instance: handbook
    app.kubernetes.io/name: handbook
    app.kubernetes.io/part-of: handbook
    app.openshift.io/runtime: spring-boot
    app.openshift.io/runtime-namespace: {{ .Release.Namespace }}
    app.openshift.io/runtime-version: latest
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      # Gateway 는 외부 트래픽 진입점이라 Istio ambient mesh(ztunnel) 를 유지한다.
      # mTLS · L7 텔레메트리 · AuthorizationPolicy 적용 대상.
      # 자체 mTLS 를 가진 stateful 컴포넌트(Kafka 등)와 달리 dataplane-mode:none 라벨을 붙이지 않는다.
      labels:
        app: gateway
        version: 0.0.1
        deployment: gateway
      annotations:
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: '8080'
    spec:
      volumes:
        - name: config
          configMap:
            name: gateway
            defaultMode: 420
        - name: observability-config
          configMap:
            name: observability
            defaultMode: 420
        - name: authentication-config
          configMap:
            name: handbook-authentication
            defaultMode: 420
      containers:
        - name: gateway
          image: {{ .Values.image.name }}:{{ .Values.image.tag | default "latest" }}
          ports:
              - containerPort: 8080
                protocol: TCP
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          env:
            - name: TZ
              value: Asia/Seoul
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: handbook-jwt
                  key: jwt-secret
            # 운영 설정은 ConfigMap "gateway" 가 /app/resources/application.yml 에
            # subPath 마운트되어 jar 의 application.yml 을 파일 단위로 덮어쓴다.
          resources:
            limits:
              cpu: '2'
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # jar 의 application.yml 을 파일 단위로 덮어쓴다 (머지가 아닌 완전 대체).
            - name: config
              mountPath: /app/resources/application.yml
              subPath: application.yml
            - name: observability-config
              mountPath: /app/resources/observability.yaml
              subPath: observability.yaml
            - name: authentication-config
              mountPath: /app/resources/authentication.yaml
              subPath: authentication.yaml
          # 부팅 완료까지 최대 150초 (30 × 5s) 허용. 그 전에는 liveness/readiness 가 평가되지 않는다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 3
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 3
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
      imagePullSecrets: []
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 0
  progressDeadlineSeconds: 600
  paused: false
