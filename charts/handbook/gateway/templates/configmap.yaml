kind: ConfigMap
apiVersion: v1
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: gateway
data:
  # jar 내부 src/main/resources/application.yml 을 기반으로 하고 이 파일은 override 만 담는다.
  # Deployment 가 SPRING_CONFIG_ADDITIONAL_LOCATION 으로 이 파일을 가리켜 merge 된다.
  application.yaml: |
    spring:
      main:
        web-application-type: reactive
      threads.virtual.enabled: true
      config:
        import:
          - classpath:observability.yaml
          - classpath:authentication.yaml
    management:
      endpoint:
        health:
          probes:
            enabled: true
    # gateway MenuService 가 /menu 를 집계할 대상 서비스 목록
    services:
      - name: login
      - name: search-type
      - name: search-document
      - name: persist-workspace