{{- /*
  release-staging Stage — 모든 서비스의 dev 통과 Freight 를 한 번에 묶어
  handbook-staging 네임스페이스에 atomic 으로 promotion. 사람이 release
  타이밍을 직접 트리거(autoPromotion=false). v2 전략의 Release Train.

  서비스 종류별 promotion key:
  - JVM 백엔드(이미지 기반):   helm.images key=image.tag, value=imageFrom(...)
  - GWT 프론트엔드(git tag 기반, name 에 "-ui" 접미사):
      helm.images key=freight.commit, value=commitFrom(...).ID
*/ -}}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: release-staging
  namespace: handbook
  annotations:
    kargo.akuity.io/color: red
spec:
  vars:
    - name: bucket
      value: handbook-staging
  requestedFreight:
    {{- range $service := .Values.services }}
    - origin:
        kind: Warehouse
        name: {{ $service.name }}
      sources:
        direct: false
        stages:
          - {{ $service.name }}-dev
    {{- end }}
  promotionTemplate:
    spec:
      steps:
        {{- range $service := .Values.services }}
        {{- if hasSuffix "-ui" $service.name }}
        - uses: argocd-update
          as: sync-{{ $service.name }}
          config:
            apps:
              - name: handbook-{{ $service.name }}-staging
                sources:
                  - repoURL: https://github.com/sayaya1090/handbook.git
                    helm:
                      images:
                        - key: freight.commit
                          value: {{ printf `${{ commitFrom("https://github.com/sayaya1090/handbook.git").ID }}` }}
                        - key: bucket
                          value: {{ printf `${{ vars.bucket }}` }}
        {{- else }}
        - uses: compose-output
          as: {{ $service.name }}-image
          config:
            img: {{ printf `${{ imageFrom("image-registry.openshift-image-registry.svc:5000/handbook/%s") }}` $service.name }}
        - uses: argocd-update
          as: sync-{{ $service.name }}
          config:
            apps:
              - name: handbook-{{ $service.name }}-staging
                sources:
                  - repoURL: https://github.com/sayaya1090/handbook.git
                    helm:
                      images:
                        - key: image.tag
                          value: {{ printf `${{ outputs['%s-image'].img.tag }}@${{ outputs['%s-image'].img.digest }}` $service.name $service.name }}
        {{- end }}
        {{- end }}
