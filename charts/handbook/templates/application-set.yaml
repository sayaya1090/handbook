apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: handbook-infrastructure
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
{{- range $stageName, $stageConfig := .Values.stages }}
          - stage: {{ $stageName }}
            bucket: {{ $stageConfig.bucket.maxSize | default "10G" | quote }}
            ip: {{ $stageConfig.database | quote }}
            schedule: {{ $stageConfig.backup.schedule | quote }}
            host: {{ $stageConfig.host | quote }}
{{- end }}
  template:
    metadata:
      name: handbook-infra-{{`{{ stage }}`}}
      labels:
        app.kubernetes.io/name: infra
        app.kubernetes.io/instance: handbook-infra-{{`{{ stage }}`}}
        handbook.sayaya.dev/service: infra
        handbook.sayaya.dev/stage: '{{`{{ stage }}`}}'
    spec:
      project: handbook
      destination:
        namespace: handbook-{{`{{ stage }}`}}
        server: https://kubernetes.default.svc
      source:
        path: charts/handbook/infrastructure
        repoURL: https://github.com/sayaya1090/handbook.git
        targetRevision: HEAD
        helm:
          parameters:
            - name: s3.bucket.name
              value: handbook-{{`{{ stage }}`}}
            - name: s3.bucket.maxSize
              value: "{{`{{ bucket }}`}}"
            - name: database.ip
              value: "{{`{{ ip }}`}}"
            - name: database.backup.schedule
              value: "{{`{{ schedule }}`}}"
            - name: host
              value: "{{`{{ host }}`}}"
            - name: stage
              value: "{{`{{ stage }}`}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio.io/dataplane-mode: ambient
            istio-discovery: enabled
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: handbook-services
  namespace: openshift-gitops
spec:
  # Kargo 의 argocd-update 가 자식 Application 의 spec.source.helm.parameters 에
  # freight.commit / image.tag / bucket 등을 주입한다. ApplicationSet 컨트롤러가
  # 기본적으로 template 에서 이 필드를 다시 렌더해 Kargo 의 변경을 덮어쓰면
  # OutOfSync 플래핑이 발생하므로, 해당 jsonPointer 를 무시 목록에 올려서
  # 자식 Application 차원의 파라미터 변경을 그대로 두게 한다.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters
  generators:
    - list:
        elements:
{{- range $service := .Values.services }}
{{- range $index, $stageName := $service.stages }}
          - service: {{ $service.name | quote }}
            serviceColor: {{ $service.color | quote }}
            stageName: {{ $stageName | quote }}
            stageColor: {{ (index $.Values.stages $stageName).color | quote }}
            host: {{ (index $.Values.stages $stageName).host | quote }}
            stagePrev: {{ if gt $index 0 }}{{ index $service.stages (sub $index 1) | quote }}{{ else }}""{{ end }}
{{- end }}
{{- end }}
  template:
    metadata:
      name: 'handbook-{{`{{ service }}`}}-{{`{{ stageName }}`}}'
      labels:
        app.kubernetes.io/name: '{{`{{ service }}`}}'
        app.kubernetes.io/instance: '{{`{{ service }}`}}-{{`{{ stageName }}`}}'
        handbook.sayaya.dev/service: '{{`{{ service }}`}}'
        handbook.sayaya.dev/stage: '{{`{{ stageName }}`}}'
      annotations:
        kargo.akuity.io/authorized-stage: 'handbook:{{`{{ service }}`}}-{{`{{ stageName }}`}}'
    spec:
      project: handbook
      destination:
        namespace: 'handbook-{{`{{ stageName }}`}}'
        server: https://kubernetes.default.svc
      source:
        path: 'charts/handbook/{{`{{ service }}`}}'
        repoURL: https://github.com/sayaya1090/handbook.git
        targetRevision: HEAD
        helm:
          parameters:
            - name: stage.name
              value: '{{`{{ stageName }}`}}'
            - name: stage.color
              value: '{{`{{ stageColor }}`}}'
            - name: stage.prev
              value: '{{`{{ stagePrev }}`}}'
            - name: color
              value: '{{`{{ serviceColor }}`}}'
            - name: host
              value: '{{`{{ host }}`}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            istio.io/dataplane-mode: ambient
            istio-discovery: enabled

