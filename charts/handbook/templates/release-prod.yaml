{{- /*
  release-prod Stage — release-staging 이 통과한 번들 digest 를 그대로 prod 로
  전진. upstream Stage 가 release-staging 한 곳뿐이라 동일 digest/commit 이
  수정 없이 전파된다. autoPromotion=false (사람이 릴리즈 결정).
*/ -}}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: release-prod
  namespace: handbook
  annotations:
    kargo.akuity.io/color: blue
spec:
  vars:
    - name: bucket
      value: handbook-prod
  requestedFreight:
    {{- range $service := .Values.services }}
    - origin:
        kind: Warehouse
        name: {{ $service.name }}
      sources:
        direct: false
        stages:
          - release-staging
    {{- end }}
  promotionTemplate:
    spec:
      steps:
        {{- range $service := .Values.services }}
        {{- if eq $service.kind "frontend" }}
        - uses: argocd-update
          as: sync-{{ $service.name }}
          config:
            apps:
              - name: handbook-{{ $service.name }}-prod
                sources:
                  - repoURL: https://github.com/sayaya1090/handbook.git
                    helm:
                      images:
                        - key: freight.commit
                          value: {{ printf `${{ commitFrom("https://github.com/sayaya1090/handbook.git").ID }}` }}
                        - key: bucket
                          value: {{ printf `${{ vars.bucket }}` }}
        {{- else }}
        - uses: compose-output
          as: {{ $service.name }}-image
          config:
            img: {{ printf `${{ imageFrom("image-registry.openshift-image-registry.svc:5000/handbook/%s") }}` $service.name }}
        - uses: argocd-update
          as: sync-{{ $service.name }}
          config:
            apps:
              - name: handbook-{{ $service.name }}-prod
                sources:
                  - repoURL: https://github.com/sayaya1090/handbook.git
                    helm:
                      images:
                        - key: image.tag
                          value: {{ printf `${{ outputs['%s-image'].img.tag }}@${{ outputs['%s-image'].img.digest }}` $service.name $service.name }}
        {{- end }}
        {{- end }}
