kind: ConfigMap
apiVersion: v1
metadata:
  name: login
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: login
data:
  # /app/resources/application.yml 에 subPath 마운트되어 jar 의 application.yml 을
  # 파일 단위로 덮어쓴다. 머지가 아닌 완전 대체이므로 운영 환경에서 필요한 모든
  # 설정을 jar 와 중복되더라도 이 파일에 다 적는다. (jar 의 application.yml 은
  # 로컬 IDE 실행용 default 로만 사용)
  application.yml: |
    spring:
      application:
        name: login
      main:
        web-application-type: reactive
      threads:
        virtual:
          enabled: true
      config:
        import:
          - classpath:observability.yaml
          - classpath:authentication.yaml
          - classpath:postgresql.yaml
      r2dbc:
        pool:
          max-size: 20
          initial-size: 5
          max-idle-time: 30m
          validation-query: SELECT 1
      security:
        oauth2:
          client:
            registration:
              google:
                client-id: ${GOOGLE_CLIENT_ID}
                client-secret: ${GOOGLE_CLIENT_SECRET}
                scope: openid, profile, email
    jwt:
      secret: ${JWT_SECRET}
      duration: ${JWT_DURATION:3600}
      publisher: ${JWT_PUBLISHER:handbook}
      client: ${JWT_CLIENT:handbook}
    auth:
      url:
        login-redirect-uri: ${LOGIN_REDIRECT_URI:/}
        logout-redirect-uri: ${LOGOUT_REDIRECT_URI:/}
    # management / logging / metrics 는 observability fragment 에서 import 됨
