{{- /* dev 만 서비스별 Stage 를 만들고 staging/prod 는 release-staging/release-prod 번들이 담당 */ -}}
{{- if and .Values.stage.name (eq .Values.stage.name "dev") }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: type-ui-{{ .Values.stage.name }}
  namespace: handbook
  annotations:
    kargo.akuity.io/color: {{ .Values.stage.color }}
spec:
  vars:
    - name: bucket
      value: handbook-{{ .Values.stage.name }}
  requestedFreight:
    - origin:
        kind: Warehouse
        name: type-ui
      sources:
        {{- if .Values.stage.prev }}
        direct: false
        stages:
          - type-ui-{{ .Values.stage.prev }}
        {{- else }}
        direct: true
        {{- end }}
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          as: sync
          config:
            apps:
              - name: handbook-type-ui-{{ .Values.stage.name }}
                sources:
                  - repoURL: https://github.com/sayaya1090/handbook.git
                    helm:
                      images:
                        - key: freight.commit
                          value: {{ printf `${{ commitFrom("https://github.com/sayaya1090/handbook.git").ID }}` }}
                        - key: bucket
                          value: {{ printf `${{ vars.bucket }}` }}
{{- end }}
