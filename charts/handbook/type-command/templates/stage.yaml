{{- /* dev 만 서비스별 Stage 를 만들고 staging/prod 는 release-staging/release-prod 번들이 담당 */ -}}
{{- if and .Values.stage.name (eq .Values.stage.name "dev") }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: type-command-{{ .Values.stage.name }}
  namespace: handbook
  annotations:
    kargo.akuity.io/color: {{ .Values.stage.color }}
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: type-command
      sources:
        {{- if .Values.stage.prev }}
        direct: false
        stages:
          - type-command-{{ .Values.stage.prev }}
        {{- else }}
        direct: true
        {{- end }}
  promotionTemplate:
    spec:
      steps:
        - uses: compose-output
          as: type-command-image
          config:
            img: {{ printf `${{ imageFrom("image-registry.openshift-image-registry.svc:5000/handbook/type-command") }}` }}
        - uses: argocd-update
          as: sync
          config:
            apps:
              - name: handbook-type-command-{{ .Values.stage.name }}
                sources:
                  - helm:
                      images:
                        - key: image.tag
                          value: {{ printf `${{ outputs['type-command-image'].img.tag }}@${{ outputs['type-command-image'].img.digest }}` }}
                    repoURL: https://github.com/sayaya1090/handbook.git
{{- end }}
