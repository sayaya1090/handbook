{{- if and .Values.stage.name .Values.host }}
---
# 로그인 UI 정적 자산 전용 HTTPRoute.
# /js/login/** 와 /js/logout/** 을 Ceph RGW(S3) bucket=handbook-<stage>/static/<key> 로 rewrite.
# 쉘 모듈이 동적으로 로그인 스크립트를 로드하므로 HTML 엔트리포인트는 없다 (shell-ui 의 /shell.html 만).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: login-ui
  namespace: handbook-{{ .Values.stage.name }}
  labels:
    app.kubernetes.io/instance: login-ui
    app.kubernetes.io/part-of: handbook
spec:
  parentRefs:
    - name: handbook
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    # /js/login/** → S3 bucket/static/js/login/**
    - matches:
        - path:
            type: PathPrefix
            value: /js/login/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/js/login/
      backendRefs:
        - name: ceph-rgw
          port: 80
    # /js/logout/** → S3 bucket/static/js/logout/**
    - matches:
        - path:
            type: PathPrefix
            value: /js/logout/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/js/logout/
      backendRefs:
        - name: ceph-rgw
          port: 80
{{- end }}
