# 스테이지별 설정
stages:
  dev:
    database: 192.168.1.212
    host: handbook.apps.sayaya.cloud
    color: green
    backup:
      schedule: '0 0 6 * * 1'  # 매주 월요일 오전 6시
    bucket:
      maxSize: 10G
  staging:
    database: 192.168.1.211
    host: handbook.sayaya.cloud
    color: red
    backup:
      schedule: ''  # 백업 안 함
    bucket:
      maxSize: 20G
  prod:
    database: 192.168.1.210
    host: handbook.sayaya.dev
    color: blue
    backup:
      schedule: '0 0 3 * * *'  # 매일 새벽 3시
    bucket:
      maxSize: 50G

# 서비스 목록 및 스테이지 설정
# color: Kargo UI 에서 Warehouse 카드를 구분하기 위한 서비스별 색상
# kind : backend (기본, Spring Boot JVM 이미지 기반 promotion)
#        frontend (GWT 정적 자산 git-tag 기반 promotion — app / *-ui)
services:
  - name: gateway
    kind: backend
    color: cyan
    stages: [dev, staging, prod]
  - name: event-broadcaster
    kind: backend
    color: orange
    stages: [dev, staging, prod]
  - name: login
    kind: backend
    color: purple
    stages: [dev, staging, prod]
  - name: workspace-command
    kind: backend
    color: yellow
    stages: [dev, staging, prod]
  - name: workspace-query
    kind: backend
    color: gold
    stages: [dev, staging, prod]
  - name: type-command
    kind: backend
    color: salmon
    stages: [dev, staging, prod]
  - name: type-query
    kind: backend
    color: coral
    stages: [dev, staging, prod]
  - name: app
    kind: frontend
    color: blue
    stages: [dev, staging, prod]
  - name: shell-ui
    kind: frontend
    color: pink
    stages: [dev, staging, prod]
  - name: login-ui
    kind: frontend
    color: magenta
    stages: [dev, staging, prod]
  - name: workspace-ui
    kind: frontend
    color: teal
    stages: [dev, staging, prod]
  - name: onboarding-ui
    kind: frontend
    color: skyblue
    stages: [dev, staging, prod]
  - name: agent-ui
    kind: frontend
    color: lime
    stages: [dev, staging, prod]
  - name: type-ui
    kind: frontend
    color: navy
    stages: [dev, staging, prod]
  - name: document-command
    kind: backend
    color: red
    stages: [dev, staging, prod]
  - name: document-query
    kind: backend
    color: brick
    stages: [dev, staging, prod]
  - name: document-ui
    kind: frontend
    color: brown
    stages: [dev, staging, prod]