{{- if and .Values.stage.name .Values.host }}
---
# 셸 UI 정적 자산 전용 HTTPRoute.
# /js/shell/** 을 Ceph RGW(S3) bucket=handbook-<stage>/static/js/shell/ 로 rewrite.
# 엔트리 HTML 은 app 차트의 /app.html (= /) 하나로 통일됐으므로 별도의 /shell.html
# 은 더 이상 노출하지 않는다. catch-all HTTPRoute(gateway) 보다 구체적인 매칭이
# 우선하는 Gateway API 매칭 우선순위에 의해 이 HTTPRoute 가 먼저 매칭되고 나머지
# 경로는 Spring Cloud Gateway 로 넘어간다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shell-ui
  namespace: handbook-{{ .Values.stage.name }}
  labels:
    app.kubernetes.io/instance: shell-ui
    app.kubernetes.io/part-of: handbook
spec:
  parentRefs:
    - name: handbook
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    # /js/shell/** → S3 bucket/static/js/shell/**
    # 공용 /js/** 와 /css/** 는 app 차트의 HTTPRoute 가 담당 (longer prefix 가 승리).
    - matches:
        - path:
            type: PathPrefix
            value: /js/shell/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/js/shell/
      backendRefs:
        - name: ceph-rgw
          port: 80
{{- end }}
