{{- if and .Values.stage.name .Values.host }}
---
# 셸 UI 정적 자산 전용 HTTPRoute.
# /shell.html 과 /js/shell/** 을 Ceph RGW(S3) bucket=handbook-<stage>/static/<key> 로 rewrite.
# catch-all HTTPRoute(gateway) 보다 구체적인 매칭이 우선하는 Gateway API 의 매칭 우선순위에 의해
# 이 HTTPRoute 가 먼저 매칭되고 나머지 경로는 Spring Cloud Gateway 로 넘어간다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shell-ui
  namespace: handbook-{{ .Values.stage.name }}
  labels:
    app.kubernetes.io/instance: shell-ui
    app.kubernetes.io/part-of: handbook
spec:
  parentRefs:
    - name: handbook
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    # /js/shell/** → S3 bucket/static/js/shell/**  (PathPrefix rewrite)
    - matches:
        - path:
            type: PathPrefix
            value: /js/shell/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/js/shell/
      backendRefs:
        - name: ceph-rgw
          port: 80
    # /shell.html 및 / (루트) → S3 bucket/static/shell.html  (Exact + ReplaceFullPath)
    - matches:
        - path:
            type: Exact
            value: /shell.html
        - path:
            type: Exact
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /handbook-{{ .Values.stage.name }}/static/shell.html
      backendRefs:
        - name: ceph-rgw
          port: 80
{{- end }}
