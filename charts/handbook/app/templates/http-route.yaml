{{- if and .Values.stage.name .Values.host }}
---
# app 모듈 (SPA 루트 번들) 전용 HTTPRoute.
# app 모듈은 shell/login/workspace 등 GWT 서브 모듈들이 공유하는 공용 정적 리소스
# (rxjs, fontawesome, sayaya-ui, theme.js, global.css, shell.css, manifest.json,
#  service-worker.js) 와 aggregate GWT 엔트리 (/app/**, /app.html) 를 담당한다.
#
# 모듈별 더 구체적인 HTTPRoute 의 PathPrefix (shell-ui 의 /js/shell/, login-ui 의
# /js/login/ 등) 는 longer prefix 가 승리하므로 이 catch-all 보다 먼저 매칭된다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: handbook-{{ .Values.stage.name }}
  labels:
    app.kubernetes.io/instance: app
    app.kubernetes.io/part-of: handbook
spec:
  parentRefs:
    - name: handbook
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    # /js/** → S3 bucket/static/js/**  (공용 라이브러리 — rxjs / fontawesome / sayaya-ui / theme …)
    - matches:
        - path:
            type: PathPrefix
            value: /js/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/js/
      backendRefs:
        - name: ceph-rgw
          port: 80
    # /css/** → S3 bucket/static/css/**  (global / shell / ui-components / agent / fontawesome)
    - matches:
        - path:
            type: PathPrefix
            value: /css/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/css/
      backendRefs:
        - name: ceph-rgw
          port: 80
    # /app/** → S3 bucket/static/app/**  (app GWT module 컴파일 출력 = app.nocache.js 등)
    - matches:
        - path:
            type: PathPrefix
            value: /app/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /handbook-{{ .Values.stage.name }}/static/app/
      backendRefs:
        - name: ceph-rgw
          port: 80
    # / (루트) 및 /app.html → S3 bucket/static/app.html  (기본 엔트리 포인트)
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /app.html
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /handbook-{{ .Values.stage.name }}/static/app.html
      backendRefs:
        - name: ceph-rgw
          port: 80
    # /manifest.json → S3 bucket/static/manifest.json (PWA manifest)
    - matches:
        - path:
            type: Exact
            value: /manifest.json
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /handbook-{{ .Values.stage.name }}/static/manifest.json
      backendRefs:
        - name: ceph-rgw
          port: 80
    # /service-worker.js → S3 bucket/static/service-worker.js (PWA SW)
    - matches:
        - path:
            type: Exact
            value: /service-worker.js
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /handbook-{{ .Values.stage.name }}/static/service-worker.js
      backendRefs:
        - name: ceph-rgw
          port: 80
{{- end }}
