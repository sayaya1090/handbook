{{- if and .Values.stage.name .Values.freight.commit .Values.bucket }}
{{- $short := .Values.freight.commit | trunc 7 }}
{{- $tag := printf "app-%s" $short }}
---
# Kargo argocd-update 가 helm parameter 로 freight.commit 과 bucket 을 주입하면,
# ArgoCD 가 reconcile 할 때마다 새 freight 마다 새 Job 이 만들어진다 (이름에 short SHA 포함).
# Job 은 GitHub release 에서 정적 자산을 받아 S3 버킷으로 sync 하고 종료.
apiVersion: batch/v1
kind: Job
metadata:
  name: app-sync-{{ $short }}
  namespace: handbook-{{ .Values.stage.name }}
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/component: sync
    handbook.sayaya.dev/freight: {{ $tag | quote }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400  # 1d
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/component: sync
        # 외부 GitHub/S3 호출이 ztunnel 과 충돌 가능 — ambient mesh 제외
        istio.io/dataplane-mode: none
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: amazon/aws-cli:latest
          env:
            - name: TAG
              value: {{ $tag | quote }}
            - name: BUCKET
              value: {{ .Values.bucket | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: RELEASE_REPO
              value: {{ .Values.release.repo | quote }}
            - name: RELEASE_ASSET
              value: {{ .Values.release.asset | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bucket
                  key: AWS_SECRET_ACCESS_KEY
          command:
            - sh
            - -c
            - |
              set -eu
              # amazon/aws-cli (AL2023) 이미지는 tar/gzip CLI 가 없고 OpenShift 는 non-root
              # 를 강제해 dnf 로 런타임 설치도 불가능하므로, 이미지에 번들된 Python 으로
              # tarfile 모듈을 써서 풀어낸다. handbook repo 는 public 이라 인증 불필요.
              echo "Resolving release $TAG from $RELEASE_REPO"
              ASSET_URL="https://github.com/$RELEASE_REPO/releases/download/$TAG/$RELEASE_ASSET"
              echo "Downloading $ASSET_URL"
              curl -fsSL -o "/tmp/$RELEASE_ASSET" "$ASSET_URL"
              mkdir -p /tmp/static
              python3 -c "import tarfile; tarfile.open('/tmp/$RELEASE_ASSET').extractall('/tmp/static')"
              echo "Syncing to s3://$BUCKET/static via $S3_ENDPOINT"
              aws s3 sync --endpoint-url "$S3_ENDPOINT" /tmp/static "s3://$BUCKET/static" \
                --acl public-read --no-verify-ssl
{{- end }}
