{{- /*
  schema-migration ConfigMap — sql/*.sql 파일을 임베드해 Job 이 psql -f 로 순차 적용.
  파일명 prefix(001_, 002_, ...) 로 실행 순서 결정. workspace 가 선행 생성되어야 type 의 FK 성립.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-migration-sql
  namespace: {{ .Release.Namespace }}
  # Job 은 argocd hook 으로 sync phase 에서 우선 apply 되는데, ConfigMap 이 일반
  # 리소스면 이보다 늦게 apply 되어 Job pod 가 FailedMount 로 CrashLoop 에 빠진다.
  # 같은 hook 으로 지정하되 sync-wave 를 Job(-5) 보다 작은 -6 으로 두어 ConfigMap
  # 이 먼저 생성되도록 보장한다.
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: schema-migration
    app.kubernetes.io/part-of: handbook
data:
{{- range $path, $_ := .Files.Glob "sql/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
