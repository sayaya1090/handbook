stage: ''            # dev/staging/prod — Gateway 리소스 이름/라벨에 사용
host: ''             # 외부 호스트명 (handbook-dev.apps.sayaya.cloud 등)
database:
  ip: ''
  persistence:
    size: 10Gi
    storageClass: ''
  backup:
    schedule: ''
  bootstrap:
    restore: false
    restorePath: ''  # 예: 'old' 또는 'backup/2024-01-01'
s3:
  bucket:
    name: ''
    maxSize: 10G
kafka:
  cluster:
    name: handbook
    replicas: 3
  version: '4.0.0'
  metadataVersion: '4.0'
  persistence:
    size: 10Gi
    storageClass: ''
  resources:
    requests:
      cpu: '500m'
      memory: '2Gi'
    limits:
      cpu: '2'
      memory: '4Gi'
  config:
    replicationFactor: 3
    minInSyncReplicas: 2
  topics:
    - name: handbook-events
      partitions: 3
      replicas: 3
      config:
        retention.ms: 604800000  # 7d
        cleanup.policy: delete
    - name: handbook-events-dlq
      partitions: 3
      replicas: 3
      config:
        retention.ms: 1209600000  # 14d
        cleanup.policy: delete
elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
  persistence:
    size: 20Gi
    storageClass: ''
  resources:
    requests:
      cpu: '500m'
      memory: '2Gi'
    limits:
      cpu: '2'
      memory: '4Gi'
  discovery:
    type: single-node
  security:
    enabled: false
