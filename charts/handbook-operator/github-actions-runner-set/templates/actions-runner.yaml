apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  namespace: {{ .Release.Namespace }}
  name: handbook-actions-runner
spec:
  resources:
    limits:
      cpu: '2'
      memory: 4Gi
    requests:
      cpu: '2'
      memory: 4Gi
  source:
    type: Dockerfile
    dockerfile: |
      # Base Image from Red Hat's Universal Base Image 10
      FROM registry.access.redhat.com/ubi10/ubi-init:latest

      # Metadata labels
      LABEL org.opencontainers.image.title="actions-runner-ubi10"
      LABEL org.opencontainers.image.description="A Red Hat UBI 10 based runner image for GitHub Actions"

      # Arguments for versioning
      ARG RUNNER_VERSION=2.333.1
      ARG RUNNER_CONTAINER_HOOKS_VERSION=0.8.1
      ARG HELM_VERSION=4.1.4

      # Environment variables for user and directory setup
      # DOCKER_UID is used for the 'docker' group to avoid conflicts with host GIDs.
      ENV UID=1000
      ENV DOCKER_UID=123
      ENV GID=0
      ENV USERNAME="runner"
      ENV WORKDIR="/home/$USERNAME"
      ENV HOME=$WORKDIR

      # Create non-root user 'runner' and set its home directory
      RUN useradd --gid "${GID}" --uid "${UID}" -ms /bin/zsh "${USERNAME}"
      WORKDIR "${WORKDIR}"

      RUN set -eux && \
      groupadd --gid "${DOCKER_UID}" docker && \

      dnf install -y dnf-plugins-core https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm && \
      /usr/bin/crb enable && \
      dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo && \
      dnf update -y && \

      dnf install -y unzip wget rsync python3-pip openssl \
          docker-ce-cli gh git git-lfs jq \
          libicu libyaml-devel net-tools zsh \
          glibc-langpack-en glibc-locale-source && \
      localedef -c -i ko_KR -f UTF-8 ko_KR.UTF-8 && \

      pip3 install --break-system-packages awscli && \

      curl -L "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz" | tar -xz && \

      curl -f -L --retry 8 --retry-delay 10 --retry-all-errors -o runner-container-hooks.zip "https://github.com/actions/runner-container-hooks/releases/download/v${RUNNER_CONTAINER_HOOKS_VERSION}/actions-runner-hooks-k8s-${RUNNER_CONTAINER_HOOKS_VERSION}.zip" && \
      unzip ./runner-container-hooks.zip -d ./k8s && \
      rm runner-container-hooks.zip && \

      curl -L "https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz" | tar -zx -C /usr/local/bin oc kubectl && \

      curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors "https://get.helm.sh/helm-v${HELM_VERSION}-linux-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -zx -C /tmp && \
      mv /tmp/linux-*/helm /usr/local/bin/helm && rm -rf /tmp/linux-* && \

      usermod -aG docker "${USERNAME}" && \

      dnf clean all && \
      rm -rf /var/cache/dnf /tmp/* /var/tmp/* && \

      chown -R "${USERNAME}":"${GID}" "${WORKDIR}"

      USER "${USERNAME}"
      RUN sh -c "$(wget -O- https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended && \
      echo 'if [ -t 1 ]; then exec zsh; fi' >> "${HOME}/.shrc"

      # Set locale and environment for the shell
      ENV LANG='ko_KR.UTF-8'
      ENV LANGUAGE='ko_KR;ko'
      ENV LC_ALL='ko_KR.UTF-8'
      ENV ENV="$HOME/.shrc"

      # Default command to start the runner
      CMD ["./run.sh"]
  strategy:
    type: Docker
  successfulBuildsHistoryLimit: 0
  failedBuildsHistoryLimit: 1
  runPolicy: Serial
  triggers:
    - type: ConfigChange
  output:
    to:
      kind: ImageStreamTag
      name: 'handbook-actions-runner:latest'

---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: handbook-actions-runner
  namespace: {{ .Release.Namespace }}