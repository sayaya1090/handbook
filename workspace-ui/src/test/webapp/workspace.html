<!DOCTYPE html>
<html>
<head>
    <title>Workspace Management Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        console.log("!!! HTML HEAD START !!!");
        window.onerror = function(msg, url, line, col, error) {
            var errorMsg = "!!! GLOBAL ERROR: " + msg + " at " + url + ":" + line + ":" + col;
            console.error(errorMsg);
            if (error && error.stack) console.error(error.stack);
            document.body.innerHTML += '<div style="color:red">' + errorMsg + '</div>';
        };
    </script>
    <script type="text/javascript" src="js/rxjs.umd.min.js"></script>
    <script type="text/javascript" src="js/sayaya-ui.js"></script>
    <script type="text/javascript" src="js/theme.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/workspace.css">
    <script type="text/javascript" src="workspace/workspace.nocache.js"></script>
</head>
<body>
    <div id="test-ready">HTML Loaded</div>
<script>
    console.log("!!! HTML BODY START !!!");
    window.addEventListener('load', function() {
        console.log("!!! WINDOW LOAD EVENT !!!");
        setTimeout(function() {
            var detail = '00000000-0000-0000-0000-000000000001';
            console.log("!!! DISPATCHING EVENT: " + detail);
            var evt = new CustomEvent('handbook-workspace', { detail: detail });
            window.dispatchEvent(evt);
        }, 1000);
    });
</script>
</body>
</html>
