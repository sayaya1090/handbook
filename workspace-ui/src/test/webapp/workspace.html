<!DOCTYPE html>
<html>
<head>
    <title>Workspace Management Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="js/rxjs.umd.min.js"></script>
    <script type="text/javascript" src="js/sayaya-ui.js"></script>
    <script type="text/javascript" src="js/theme.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/workspace.css">
    <script type="text/javascript">
        // Mock WindowRenderBridge for standalone test
        window.WindowRenderBridge = {
            next: function(render) {
                var frame = document.getElementById('frame');
                if (!frame) {
                    frame = document.createElement('div');
                    frame.id = 'frame';
                    document.body.appendChild(frame);
                }
                render(frame);
            }
        };

        window.addEventListener('load', function() {
            setTimeout(function() {
                var event = new CustomEvent('handbook-workspace-context', { detail: 'test-workspace' });
                window.dispatchEvent(event);
            }, 100);
        });
    </script>
    <script type="text/javascript" src="workspace/workspace.nocache.js"></script>
</head>
<body></body>
</html>
