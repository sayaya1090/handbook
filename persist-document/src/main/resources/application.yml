spring:
  application:
    name: persist-document
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:handbook}
    username: ${DB_USER:handbook}
    password: ${DB_PASSWORD:handbook}
  cloud:
    stream:
      bindings:
        document-out-0:
          destination: handbook-events
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
